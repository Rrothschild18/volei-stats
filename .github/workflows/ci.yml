name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, testes de unidade e build: minutos baixos, e barram quase tudo.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Testes de unidade
        run: pnpm test
      - name: Build
        run: pnpm build

      # O modelo de acesso e as regras que viraram constraints. Sobe um Postgres
      # descartável em Docker; não precisa de conta no Supabase.
      - name: Suíte SQL
        run: pnpm test:sql

  # Os caminhos que atravessam o banco de verdade. Separado do job de cima para
  # que uma falha de lint não espere o Supabase subir.
  ponta-a-ponta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Subir o Supabase local
        run: supabase start

      - name: Instalar o navegador
        run: pnpm exec playwright install --with-deps chromium

      - name: Tipos dos testes de ponta a ponta
        run: pnpm typecheck:e2e

      - name: Testes de ponta a ponta
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
